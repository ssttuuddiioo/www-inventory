<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖥️</text></svg>">
<title>WWW Install Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EEF0EC; --paper:#FFFFFF; --paper-2:#F6F7F4; --ink:#15171A; --muted:#62676E; --faint:#8C9097;
  --rule:#D9DCD5; --rule-2:#E7E9E4;
  --link:#1A3BD6; --link-soft:#E6EAFB;
  --open:#C4402B; --open-bg:#FBE9E5;
  --assigned:#9A6A06; --assigned-bg:#FBF1DA;
  --onsite:#0B7480; --onsite-bg:#DDF1F2;
  --installed:#2C7F3A; --installed-bg:#E1F2E3;
  --cut:#9A9EA4; --cut-bg:#EEEFEE;
  --shadow:0 1px 2px rgba(20,24,30,.06),0 6px 24px rgba(20,24,30,.06);
  --sans:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111316; --paper:#181B1F; --paper-2:#1D2025; --ink:#ECEEF0; --muted:#A1A6AD; --faint:#7A7F87;
    --rule:#2E3238; --rule-2:#25282D;
    --link:#8FA6FF; --link-soft:#1E2747;
    --open:#FF8A74; --open-bg:#3A1F1A; --assigned:#E8B64C; --assigned-bg:#352A12;
    --onsite:#5CCBD6; --onsite-bg:#123236; --installed:#79D089; --installed-bg:#16301B;
    --cut:#6E737A; --cut-bg:#22252A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#111316; --paper:#181B1F; --paper-2:#1D2025; --ink:#ECEEF0; --muted:#A1A6AD; --faint:#7A7F87;
  --rule:#2E3238; --rule-2:#25282D;
  --link:#8FA6FF; --link-soft:#1E2747;
  --open:#FF8A74; --open-bg:#3A1F1A; --assigned:#E8B64C; --assigned-bg:#352A12;
  --onsite:#5CCBD6; --onsite-bg:#123236; --installed:#79D089; --installed-bg:#16301B;
  --cut:#6E737A; --cut-bg:#22252A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:0 80px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.tabs{display:flex;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:3px}
.tabs a{padding:6px 12px;border-radius:5px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:7px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.me{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.me input{width:150px;border:1px solid var(--rule);background:var(--paper);border-radius:7px;padding:6px 9px;font-size:13px}
@media (max-width:560px){.me{flex:1 1 100%}.me input{flex:1;width:auto}}
.btn.primary{background:var(--link);border-color:var(--link);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0c1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0c1020}}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--rule)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 6px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--rule);background:var(--paper);border-radius:7px;padding:8px 11px}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 11px 5px 9px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.chip .c{font-family:var(--mono);font-weight:500;color:var(--faint)}
.gear-row{margin:6px 0}
.flabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-right:2px;min-width:38px}
.chip.gchip{padding-left:11px}
.chip.gchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.gchip[aria-pressed="true"] .c{color:var(--paper);opacity:.7}
.artist-sel{max-width:100%}
.artist-sel.on,.sel.on{border-color:var(--ink);font-weight:600}
.sel{border:1px solid var(--rule);background:var(--paper);border-radius:7px;padding:6px 8px;font-size:13px}

/* summary */
.summary{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;margin-top:18px}
@media (max-width:900px){.summary{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.panel h3{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--rule-2)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:9px;height:9px;border-radius:2px}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px;margin-top:10px}
.kv .num{text-align:right}
.kv .sub{color:var(--muted)}
.statline{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.statline small{display:block;color:var(--muted);font-size:12px;margin-top:3px}

/* sections */
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:0 2px 8px;border-bottom:2px solid var(--ink)}
.sec-h h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.sec-h .meta{color:var(--muted);font-size:13px}
.sec-h .mini{margin-left:auto;width:140px}
@media (max-width:560px){.sec-h .mini{width:100%;margin-left:0}}

/* rows */
.list{background:var(--paper);border:1px solid var(--rule);border-top:0;border-radius:0 0 10px 10px}
.row{border-top:1px solid var(--rule-2);position:relative}
.row:first-child{border-top:0}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st)}
.row-main{display:grid;grid-template-columns:30px minmax(0,2.2fr) minmax(0,1.6fr) 150px 46px 118px 44px;gap:10px;align-items:center;padding:9px 12px 9px 14px;cursor:pointer}
.row-main:hover{background:var(--paper-2)}
.check{width:22px;height:22px;border:2px solid var(--faint);border-radius:5px;background:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0}
.check svg{width:14px;height:14px;opacity:0}
.row[data-status="installed"] .check{background:var(--installed);border-color:var(--installed)}
.row[data-status="installed"] .check svg{opacity:1;stroke:var(--paper)}
.nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.nm .kind{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:1px 5px;margin-left:6px;white-space:nowrap}
.work{min-width:0;font-size:13.5px;line-height:1.25}
.work a{color:var(--link);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.work small{display:block;color:var(--muted)}
.src{font-size:12.5px;color:var(--muted);min-width:0}
.src b{display:inline-block;font-weight:600;color:var(--ink);border-radius:4px;padding:1px 6px;background:var(--paper-2);border:1px solid var(--rule-2)}
.src b.tbd,.src b.buy{color:var(--open);border-color:color-mix(in srgb,var(--open) 35%,transparent);background:var(--open-bg)}
.qty{text-align:right;font-family:var(--mono);font-size:13px}
.qty.multi{font-weight:600}
.status{appearance:none;-webkit-appearance:none;border:0;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;background:var(--stbg);color:var(--st);width:100%;text-align:center}
.notes-n{font-family:var(--mono);font-size:12px;color:var(--faint);text-align:right;white-space:nowrap;padding:4px 6px}
.notes-n.has{color:var(--ink)}
.row[data-status="open"]{--st:var(--open);--stbg:var(--open-bg)}
.row[data-status="assigned"]{--st:var(--assigned);--stbg:var(--assigned-bg)}
.row[data-status="onsite"]{--st:var(--onsite);--stbg:var(--onsite-bg)}
.row[data-status="installed"]{--st:var(--installed);--stbg:var(--installed-bg)}
.row.cut{--st:var(--cut);--stbg:var(--cut-bg)}
.row.cut .nm,.row.cut .work,.row.cut .src,.row.cut .qty{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--faint)}
.row.cut .work a{color:var(--faint)}
.row.cut .nm::after{content:"not needed";text-decoration:none;display:inline-block;margin-left:8px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
@media (max-width:820px){
  .row-main{grid-template-columns:30px minmax(0,1fr) 112px;grid-template-areas:"c n s" "c w w" "c r r"}
  .row-main>.check{grid-area:c;align-self:start}
  .row-main>.nm{grid-area:n}
  .row-main>.status-cell{grid-area:s}
  .row-main>.work{grid-area:w}
  .row-main>.meta-line{grid-area:r;display:flex;gap:10px;align-items:center}
  .row-main>.src,.row-main>.qty,.row-main>.notes-n{display:none}
}
@media (min-width:821px){.meta-line{display:none}}
.meta-line{font-size:12.5px;color:var(--muted)}

/* expanded */
.detail{padding:4px 16px 16px 56px;display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media (max-width:820px){.detail{grid-template-columns:1fr;padding-left:16px}}
.detail h4{margin:8px 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.note{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:7px 0;border-top:1px dashed var(--rule)}
.note:first-of-type{border-top:0}
.note .tick{grid-row:span 2;margin-top:2px}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note small{color:var(--faint);font-size:11.5px}
.note.done p{text-decoration:line-through;color:var(--faint)}
.tick{width:18px;height:18px;border:1.5px solid var(--faint);border-radius:4px;background:transparent;cursor:pointer;padding:0;display:grid;place-items:center}
.tick svg{width:11px;height:11px;opacity:0;stroke:var(--paper)}
.note.done .tick{background:var(--faint);border-color:var(--faint)}
.note.done .tick svg{opacity:1}
.addnote{display:flex;gap:8px;margin-top:8px}
.addnote textarea{flex:1;min-width:0;border:1px solid var(--rule);border-radius:7px;padding:7px 10px;background:var(--paper-2);resize:vertical;min-height:38px}
.form{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:13px}
.form label{color:var(--muted)}
.form input,.form select{border:1px solid var(--rule);border-radius:6px;padding:6px 8px;background:var(--paper-2);min-width:0;width:100%}
.hist{margin:10px 0 0;padding:0;list-style:none;font-size:12px;color:var(--muted);max-height:160px;overflow:auto}
.hist li{padding:2px 0}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* artist grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:22px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--ink)}
.card .t{font-weight:700;font-size:16px;line-height:1.2;color:var(--link);text-wrap:balance}
.card .a{color:var(--muted);font-size:13px;margin-top:-4px}
.card .gear{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px}
.card .gear span{background:var(--paper-2);border:1px solid var(--rule-2);border-radius:4px;padding:1px 6px;color:var(--ink)}
.card .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:auto}
.card .foot b.warn{color:var(--open)}
.card .foot b.ok{color:var(--installed)}

/* work page */
.crumb{margin-top:20px;font-size:13px}
.crumb a{color:var(--muted)}
.hero{margin-top:10px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.hero h1{margin:0;font-size:clamp(28px,4.4vw,44px);line-height:1.02;letter-spacing:-.025em;font-weight:800;text-wrap:balance;color:var(--link);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.hero .by{font-size:18px;color:var(--muted);margin-top:8px}
.hero .facts{margin-left:auto;display:flex;gap:22px}
.hero .facts div{font-size:12px;color:var(--muted)}
.hero .facts b{display:block;font-size:22px;color:var(--ink);font-family:var(--mono);font-weight:500}
.worknotes{margin-top:20px}

/* dialog */
dialog{border:1px solid var(--rule);border-radius:12px;background:var(--paper);color:var(--ink);padding:20px;width:min(460px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,12,16,.4)}
dialog h2{margin:0 0 14px;font-size:18px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);z-index:50}
.notice{margin-top:18px;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--muted)}
.ro .check,.ro .status,.ro .tick{pointer-events:none}
@media (prefers-reduced-motion:no-preference){.row,.card{transition:background .15s,border-color .15s}}

.chip.zone[aria-pressed="false"]{border-color:color-mix(in srgb,var(--link) 40%,var(--rule));color:var(--link)}
.zonetag{align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--link);background:var(--link-soft);border-radius:4px;padding:2px 7px;margin-bottom:-2px}
.areafield{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.areafield input{border:1px solid var(--rule);background:var(--paper);border-radius:7px;padding:6px 10px;width:200px;max-width:100%}
.list-head{display:grid;grid-template-columns:28px minmax(0,2.3fr) minmax(0,1.7fr) 120px 34px 118px 44px;gap:12px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--rule);background:var(--paper-2);font-size:11px;align-items:center}
.list-head>span{display:flex;align-items:center;gap:4px;min-width:0}
.lh-r{justify-content:flex-end}
.lh-plain,.lh-sep{color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.sortbtn{border:0;background:none;padding:2px 0;cursor:pointer;font:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.sortbtn .arr{font-size:11px;opacity:.35}
.sortbtn:hover{color:var(--ink)} .sortbtn:hover .arr{opacity:.8}
.sortbtn.on{color:var(--link)} .sortbtn.on .arr{opacity:1}
.sort-sel{display:none}
@media (max-width:820px){.list-head{display:none}.sort-sel{display:block}}
/* ---- cleanup layer ---- */
.wrap{max-width:1160px}
.brand b{font-size:17px}
.brand span{margin-top:2px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}

.overview{margin-top:20px;background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.ov-progress{padding:16px 20px 14px;border-bottom:1px solid var(--rule-2)}
.ov-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.ov-count{font-size:13px;color:var(--muted)} .ov-count b{color:var(--ink);font-weight:500}
.overview .bar{height:8px;border-radius:99px}
.overview .legend{margin-top:10px;font-size:12.5px;color:var(--muted);gap:4px 18px}
.overview .legend b{color:var(--ink);font-weight:500}
.overview .legend .dot{border-radius:50%;width:8px;height:8px}
.ov-stats{display:grid;grid-template-columns:1.4fr 1.4fr 1fr 1fr}
.stat{padding:14px 20px 16px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--rule-2);min-width:0}
.stat:first-child{border-left:0}
.stat .big{font-size:28px;font-weight:500;margin-top:6px;letter-spacing:-.02em}
.stat .big small{font-size:14px;color:var(--muted)}
.note-s{font-size:12px;color:var(--muted)}
.kinds{display:flex;flex-wrap:wrap;gap:3px 12px;margin:8px 0 4px;font-size:12.5px;color:var(--muted)}
.kinds b{color:var(--ink);font-weight:500}
@media (max-width:860px){.ov-stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--rule-2)}}
@media (max-width:480px){.ov-stats{grid-template-columns:1fr}.stat{border-left:0;border-top:1px solid var(--rule-2)}.stat:first-child{border-top:0}}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 10px}
.toolbar .search{flex:1 1 260px}
.search,.sel{height:36px}
.sel{padding:0 28px 0 10px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat}
.artist-sel{max-width:260px}
.toggle{height:36px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--paper);border-radius:7px;padding:0 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.toggle .sw{width:26px;height:16px;border-radius:99px;background:var(--rule);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--paper);transition:transform .15s}
.toggle[aria-pressed="true"]{color:var(--ink)}
.toggle[aria-pressed="true"] .sw{background:var(--ink)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(10px)}
.toggle .c{font-family:var(--mono);font-weight:500;color:var(--faint)}
.facets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0}
.facets + .facets{border-top:1px dashed var(--rule)}
.facets.sub{padding-left:0}
.flabel{width:54px;flex:none;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
@media (max-width:560px){.flabel{width:100%}}
.chip{height:28px;padding:0 10px;font-size:12.5px;background:transparent;border-color:var(--rule);color:var(--ink);font-weight:500}
.chip:hover{border-color:var(--faint)}
.chip .c{font-size:11.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] .c{color:var(--paper);opacity:.65}
.linkbtn{border:0;background:none;color:var(--link);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 6px}
.linkbtn:hover{text-decoration:underline}

.sec{margin-top:34px}
.sec-h{border-bottom:0;padding:0 2px 10px;align-items:center}
.sec-h h2{font-size:19px}
.sec-h .meta{font-family:var(--sans);font-size:12.5px}
.sec-h .mini .bar{height:6px;border-radius:99px}
.list{border-top:1px solid var(--rule);border-radius:10px;overflow:hidden}

.row::before{display:none}
.row-main{grid-template-columns:28px minmax(0,2.3fr) minmax(0,1.7fr) 120px 34px 118px 44px;gap:12px;padding:10px 12px 10px 16px}
.row.open{background:var(--paper-2)}
.row.open .row-main:hover{background:transparent}
.check{width:20px;height:20px;border-width:1.5px;border-color:var(--rule);border-radius:5px}
.row-main:hover .check{border-color:var(--faint)}
.nm{font-weight:500}
.nm .kind{font-size:10.5px;border:0;background:var(--paper-2);padding:2px 6px;color:var(--muted)}
.row.open .nm .kind{background:var(--paper)}
.work{font-size:13px}
.work a{text-decoration-color:color-mix(in srgb,var(--link) 35%,transparent)}
.work a:hover{text-decoration-color:var(--link)}
.work small{font-size:12px}
.srctxt{font-size:12.5px;color:var(--ink)}
.srctxt.tbd,.srctxt.buy{color:var(--open);font-weight:600}
.qty{color:var(--muted);font-size:12.5px}
.status{padding:5px 10px;font-size:11.5px;font-weight:600;letter-spacing:.01em}
.expand{display:inline-flex;align-items:center;justify-content:flex-end;gap:6px;border:0;background:none;color:var(--faint);cursor:pointer;padding:4px;justify-self:end}
.expand:hover{color:var(--ink)}
.expand svg{transition:transform .15s}
.row.open .expand svg{transform:rotate(180deg);color:var(--ink)}
.ncount{font-family:var(--mono);font-size:11px;min-width:18px;height:18px;border-radius:99px;display:inline-grid;place-items:center;padding:0 5px;background:var(--rule-2);color:var(--muted)}
.ncount.has{background:var(--ink);color:var(--paper)}
.row.cut .status{opacity:.5}
.detail{padding:2px 16px 18px 56px}
.detail h4{font-size:11px;letter-spacing:.09em}
.meta-line .srctxt{font-size:12.5px}
@media (max-width:820px){
  .row-main{grid-template-columns:28px minmax(0,1fr) 112px 28px;grid-template-areas:"c n s e" "c w w w" "c r r r";row-gap:4px}
  .row-main>.expand{grid-area:e;align-self:start}
  .row-main>.notes-n{display:none}
}
.meta-line{gap:12px}

.grid{gap:14px}
.card{border-radius:12px;padding:16px 18px;gap:10px}
.card .t{font-size:15.5px}
.card .gear span{border:0}
.card .bar{height:6px;border-radius:99px}
.hero h1{text-decoration:none;color:var(--ink)}
.hero .by{font-size:16px}
.hero .facts b{font-size:20px}
</style>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>


<header class="top">
  <div class="top-in">
    <div class="brand"><b>WWW · Install Inventory</b><span>ArtxCode | Rhizome at Projekt Blank</span></div>
    <nav class="tabs" aria-label="View">
      <a href="#/gear" id="tab-gear">By gear</a>
      <a href="#/artists" id="tab-artists">By artwork</a>
    </nav>
    <label class="me"><span>Your name</span><input id="me" type="text" placeholder="for notes & changes" autocomplete="name"></label>
    <button class="btn primary" id="add-btn" type="button">+ Add item</button>
  </div>
</header>

<main class="wrap" id="app">
  <div class="notice" id="boot">Loading inventory…</div>
</main>

<dialog id="add-dlg">
  <form method="dialog" id="add-form">
    <h2>Add an item</h2>
    <div class="form">
      <label for="add-work">Artwork</label><select id="add-work" required></select>
      <label for="add-name">Item</label><input id="add-name" required placeholder="e.g. HDMI cable, 10 ft">
      <label for="add-cat">Category</label><select id="add-cat"></select>
      <label for="add-kind">Type</label><input id="add-kind" placeholder="e.g. TV, CRT, NUC (optional)">
      <label for="add-qty">Qty</label><input id="add-qty" type="number" min="1" value="1">
      <label for="add-src">Coming from</label><select id="add-src"></select>
      <label for="add-note">Note</label><input id="add-note" placeholder="optional">
    </div>
    <div class="actions">
      <button class="btn ghost" value="cancel" formnovalidate type="submit">Cancel</button>
      <button class="btn primary" value="ok" type="submit" id="add-ok">Add item</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
const CATS = [
  ["display","Displays"],["computer","Computers"],["input","Input devices"],["audio","Audio"],
  ["cable","Cables & power"],["mount","Mounts & structures"],["furniture","Plinths"],
  ["cover","Cable covers"],["light","Lighting"],["supplies","Supplies & contingency"]
];
const CAT = Object.fromEntries(CATS);
const STATUSES = [["open","Needs source"],["assigned","Source set"],["onsite","In gallery"],["installed","Installed"]];
const ST = Object.fromEntries(STATUSES);
const SOURCES = [["gallery","Projekt Blank"],["rhizome","Rhizome"],["onx","ONX"],["loan","Artist loan"],["buy","To buy"],["tbd","No source yet"]];
const SRC = Object.fromEntries(SOURCES);
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

const S = { items: new Map(), works: new Map(), loadedI:false, loadedW:false, db:null, user:null, me:null, ro:false,
  open: new Set(), drafts: {}, route: "gear",
  f: { q:"", st: new Set(), src:"", showCut:true, cat: new Set(), kind: new Set(), work:"", zone: new Set(), sort:null } };

const ls = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const saved = ls.get("www-inv-filters", null);
if (saved){ S.f.q = saved.q||""; S.f.st = new Set(saved.st||[]); S.f.src = saved.src||""; S.f.showCut = saved.showCut!==false; S.f.cat = new Set(saved.cat||[]); S.f.kind = new Set(saved.kind||[]); S.f.work = saved.work||""; S.f.zone = new Set(saved.zone||[]); S.f.sort = saved.sort||null; }
const saveF = () => ls.set("www-inv-filters", {q:S.f.q, st:[...S.f.st], src:S.f.src, showCut:S.f.showCut, cat:[...S.f.cat], kind:[...S.f.kind], work:S.f.work, zone:[...S.f.zone], sort:S.f.sort});

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtT = t => { try{ const d=new Date(t); return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }catch(e){ return ""; } };
const money = n => "$" + Math.round(n).toLocaleString();
let toastT;
function toast(msg){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el);} el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2200); }

/* ---------- writes (Supabase RPCs, one at a time per row) ---------- */
const queues = new Map();
function queue(key, job){
  const next = (queues.get(key) || Promise.resolve()).then(job).catch(()=>{});
  queues.set(key, next); return next;
}
async function rpc(fn, args){
  let r = await S.db.rpc(fn, args);
  if (r.error && /fetch|network/i.test(r.error.message||"")){ await new Promise(x=>setTimeout(x,500+Math.random()*700)); r = await S.db.rpc(fn, args); }
  if (r.error){ toast("Couldn't save that change. Try again."); throw r.error; }
  await refresh(); return r.data;
}
const who = () => S.me || "Someone";
function logEntry(what){ return { t:new Date().toISOString(), by:who(), what }; }
function patch(col, id, fn){
  return queue(col+"/"+id, async () => { const r = fn(); if (!r) return;
    await rpc("wwwinv_patch", { p_table: col, p_id: id, p_patch: r.patch, p_hist: r.what ? logEntry(r.what) : null }); });
}
function setStatus(id, status){
  patch("items", id, () => { const it=S.items.get(id); if(!it||it.status===status) return null;
    return { patch:{status}, what:`Status: ${ST[it.status]||it.status} → ${ST[status]}` }; });
}
function toggleCut(id){
  patch("items", id, () => { const it=S.items.get(id); if(!it) return null;
    return { patch:{cut:!it.cut}, what: it.cut ? "Restored to the list" : "Marked not needed" }; });
}
function editField(id, field, value, label){
  patch("items", id, () => { const it=S.items.get(id); if(!it) return null;
    if (String(it[field] ?? "") === String(value ?? "")) return null;
    const show = v => field==="source" ? SRC[v] : field==="cat" ? CAT[v] : field==="work" ? ((S.works.get(v)||{}).title||v) : (v===""||v==null?"—":v);
    return { patch:{[field]:value}, what:`${label}: ${show(it[field])} → ${show(value)}` }; });
}
function setZone(id, zone){
  patch("works", id, () => { const w=S.works.get(id); if(!w||(w.zone||"")===zone) return null; toast(zone?`Area set to ${zone}`:"Area cleared"); return { patch:{zone} }; });
}
function addNote(col, id, text){
  queue(col+"/"+id, () => rpc("wwwinv_add_note", { p_table: col, p_id: id, p_text: text, p_by: who() }));
}
function toggleNote(col, id, idx){
  queue(col+"/"+id, () => rpc("wwwinv_toggle_note", { p_table: col, p_id: id, p_idx: idx, p_by: who() }));
}

/* ---------- derived ---------- */
const itemsArr = () => [...S.items.entries()].map(([id,d])=>({id,...d})).sort((a,b)=>(a.order??1e9)-(b.order??1e9));
const worksArr = () => [...S.works.entries()].map(([id,d])=>({id,...d})).sort((a,b)=>(a.order??1e9)-(b.order??1e9));
const workOf = it => S.works.get(it.work) || {title:"Unassigned", artist:""};
function matches(it){
  if (!S.f.showCut && it.cut) return false;
  if (S.f.st.size && (it.cut || !S.f.st.has(it.status))) return false;
  if (S.f.src && it.source !== S.f.src) return false;
  if (S.f.work && it.work !== S.f.work) return false;
  if (S.f.zone.size && !S.f.zone.has(workOf(it).zone||"")) return false;
  if (S.f.cat.size && !S.f.cat.has(it.cat)) return false;
  if (S.f.kind.size && !S.f.kind.has(it.kind||"Other")) return false;
  if (S.f.q){
    const w = workOf(it);
    const hay = [it.name,it.kind,CAT[it.cat],SRC[it.source],it.vendor,w.title,w.artist,...(it.notes||[]).map(n=>n.text)].join(" ").toLowerCase();
    if (!S.f.q.toLowerCase().split(/\s+/).filter(Boolean).every(t=>hay.includes(t))) return false;
  }
  return true;
}
const units = arr => arr.reduce((s,i)=>s+(Number(i.qty)||1),0);
function statusCounts(arr){ const c={open:0,assigned:0,onsite:0,installed:0,cut:0}; arr.forEach(i=> i.cut? c.cut++ : c[i.status]=(c[i.status]||0)+1); return c; }
function miniBar(arr){
  const c = statusCounts(arr), live = arr.length - c.cut || 1;
  return `<div class="bar" role="img" aria-label="${STATUSES.map(([k,l])=>`${c[k]} ${l}`).join(", ")}">${STATUSES.map(([k])=>`<i style="width:${c[k]/live*100}%;background:var(--${k})"></i>`).join("")}</div>`;
}

/* ---------- render ---------- */
function captureFocus(){
  const a = document.activeElement;
  if (a && a.id && (a.tagName==="INPUT"||a.tagName==="TEXTAREA")) return {id:a.id, s:a.selectionStart, e:a.selectionEnd};
  return null;
}
function restoreFocus(f){
  document.querySelectorAll("[data-draft]").forEach(el => { if (S.drafts[el.id] != null) el.value = S.drafts[el.id]; });
  if (!f) return; const el = document.getElementById(f.id); if (!el) return;
  el.focus(); try{ el.setSelectionRange(f.s, f.e); }catch(e){}
}

function render(){
  if (!S.db) return;
  if (!(S.loadedI && S.loadedW)) return;
  const f = captureFocus();
  const app = $("#app");
  const h = location.hash || "#/gear";
  const m = h.match(/^#\/w\/([\w-]+)/);
  S.route = m ? "work" : h.startsWith("#/artists") ? "artists" : "gear";
  $("#tab-gear").toggleAttribute("aria-current", S.route==="gear"); if(S.route==="gear") $("#tab-gear").setAttribute("aria-current","page");
  $("#tab-artists").toggleAttribute("aria-current", S.route!=="gear"); if(S.route!=="gear") $("#tab-artists").setAttribute("aria-current","page");
  app.classList.toggle("ro", S.ro);
  if (!S.items.size){ app.innerHTML = `<div class="notice">The inventory is empty.</div>`; return; }
  app.innerHTML = S.route==="work" ? renderWork(m[1]) : S.route==="artists" ? renderArtists() : renderGear();
  restoreFocus(f);
  fillNames();
}

function renderFilters(){
  const all = itemsArr(); const c = statusCounts(all);
  return `<div class="toolbar">
    <input class="search" id="q" type="search" placeholder="Search items, artworks, artists, notes" value="${esc(S.f.q)}" aria-label="Search">
    ${artistSelect()}
    ${sortSelect()}
    <select class="sel ${S.f.src?"on":""}" id="srcf" aria-label="Filter by source"><option value="">All sources</option>${SOURCES.map(([k,l])=>`<option value="${k}" ${S.f.src===k?"selected":""}>${l}</option>`).join("")}</select>
    <button type="button" class="toggle" id="cutf" aria-pressed="${!S.f.showCut}"><span class="sw" aria-hidden="true"></span>Hide not needed <span class="c">${c.cut}</span></button>
  </div>
  <div class="facets"><span class="flabel">Status</span>
    ${STATUSES.map(([k,l])=>`<button type="button" class="chip" data-stf="${k}" aria-pressed="${S.f.st.has(k)}"><span class="dot" style="background:var(--${k})"></span>${l}<span class="c">${c[k]}</span></button>`).join("")}
    ${S.f.st.size?`<button type="button" class="linkbtn" id="stclear">Clear</button>`:""}
  </div>${zoneFilters()}${gearFilters()}`;
}

function artistSelect(){
  const ws = worksArr().slice().sort((a,b)=>a.artist.localeCompare(b.artist));
  if (S.f.work && !S.works.has(S.f.work)) S.f.work = "";
  return `<select class="sel artist-sel ${S.f.work?"on":""}" id="workf" aria-label="Filter by artist"><option value="">All artists</option>${ws.map(w=>`<option value="${w.id}" ${S.f.work===w.id?"selected":""}>${esc(w.artist)} — ${esc(w.title)}</option>`).join("")}</select>`;
}

function zoneFilters(){
  const ws = worksArr().filter(w=>w.id!=="w99");
  const m = {}; ws.forEach(w=>{ const z=w.zone||""; m[z]=(m[z]||0)+1; });
  const zones = Object.keys(m).filter(Boolean).sort();
  if (!zones.length) return "";
  if (m[""]) zones.push("");
  return `<div class="facets"><span class="flabel">Area</span>${zones.map(z=>`<button type="button" class="chip ${z?"zone":""}" data-zonef="${esc(z)}" aria-pressed="${S.f.zone.has(z)}">${z?esc(z):"No area"}<span class="c">${m[z]} ${m[z]===1?"artist":"artists"}</span></button>`).join("")}${S.f.zone.size?`<button type="button" class="linkbtn" id="zoneclear">Clear</button>`:""}</div>`;
}

function gearFilters(){
  const all = itemsArr().filter(i=>!i.cut);
  const catChips = CATS.filter(([k])=>all.some(i=>i.cat===k)).map(([k,l])=>`<button type="button" class="chip" data-catf="${k}" aria-pressed="${S.f.cat.has(k)}">${l}<span class="c">${units(all.filter(i=>i.cat===k))}</span></button>`).join("");
  let kindChips = "";
  if (S.f.cat.size){
    const m = {}; all.filter(i=>S.f.cat.has(i.cat)).forEach(i=>{ const k=i.kind||"Other"; m[k]=(m[k]||0)+(Number(i.qty)||1); });
    const kinds = Object.entries(m).sort((a,b)=>b[1]-a[1]);
    if (kinds.length > 1 || (kinds[0] && kinds[0][0] !== "Other"))
      kindChips = `<div class="facets sub"><span class="flabel">Type</span>${kinds.map(([k,n])=>`<button type="button" class="chip" data-kindf="${esc(k)}" aria-pressed="${S.f.kind.has(k)}">${esc(k)}<span class="c">${n}</span></button>`).join("")}</div>`;
  }
  const any = S.f.cat.size || S.f.kind.size;
  return `<div class="facets"><span class="flabel">Gear</span>${catChips}${any?`<button type="button" class="linkbtn" id="gearclear">Clear</button>`:""}</div>${kindChips}`;
}

function renderSummary(){
  const all = itemsArr().filter(i=>!i.cut);
  const c = statusCounts(itemsArr());
  const total = all.length || 1;
  const here = arr => units(arr.filter(i=>i.status==="onsite"||i.status==="installed"));
  const byKind = (cat) => { const m={}; all.filter(i=>i.cat===cat).forEach(i=>{ const k=i.kind||"Other"; m[k]=(m[k]||0)+(Number(i.qty)||1); }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const kinds = cat => byKind(cat).map(([k,n])=>`<span><b class="num">${n}</b> ${esc(k)}</span>`).join("");
  const disp = all.filter(i=>i.cat==="display"), comp = all.filter(i=>i.cat==="computer");
  const ft = all.filter(i=>i.cat==="cover").reduce((s,i)=>s+(Number(i.ft)||0),0);
  const cost = all.reduce((s,i)=>s+(Number(i.cost)||0)*(Number(i.qty)||1),0);
  return `<section class="overview" aria-label="Summary">
    <div class="ov-progress">
      <div class="ov-head"><span class="eyebrow">Install progress</span><span class="num ov-count"><b>${c.installed}</b> / ${total} installed</span></div>
      <div class="bar">${STATUSES.map(([k])=>`<i style="width:${c[k]/total*100}%;background:var(--${k})"></i>`).join("")}</div>
      <div class="legend">${STATUSES.map(([k,l])=>`<span><i class="dot" style="background:var(--${k})"></i>${l} <b class="num">${c[k]}</b></span>`).join("")}${c.cut?`<span class="muted">Not needed <b class="num">${c.cut}</b></span>`:""}</div>
    </div>
    <div class="ov-stats">
      <div class="stat"><span class="eyebrow">Screens</span><span class="big num">${units(disp)}</span><span class="note-s">${here(disp)} in gallery</span><div class="kinds">${kinds("display")}</div></div>
      <div class="stat"><span class="eyebrow">Computers</span><span class="big num">${units(comp)}</span><span class="note-s">${here(comp)} in gallery</span><div class="kinds">${kinds("computer")}</div><span class="note-s">Sheet numbers 8 NUCs, plus 3 more</span></div>
      <div class="stat"><span class="eyebrow">Cable cover</span><span class="big num">${ft}<small> ft</small></span><span class="note-s">from item specs</span></div>
      <div class="stat"><span class="eyebrow">Est. cost</span><span class="big num">${money(cost)}</span><span class="note-s">of $4,000 budget</span></div>
    </div>
  </section>`;
}

/* ---------- sorting ---------- */
const SORTS = {
  name:   ["Item",        i => i.name],
  work:   ["Artwork",     i => workOf(i).title],
  artist: ["Artist",      i => workOf(i).artist],
  source: ["Coming from", i => SRC[i.source] || i.source],
  qty:    ["Qty",         i => Number(i.qty) || 1],
  status: ["Status",      i => STATUSES.findIndex(x => x[0] === i.status)],
};
function sortRows(rows){
  const srt = S.f.sort; if (!srt || !SORTS[srt.key]) return rows;
  const f = SORTS[srt.key][1], dir = srt.dir === "desc" ? -1 : 1;
  return rows.slice().sort((a,b) => {
    const x = f(a), y = f(b);
    const c = typeof x === "number" ? x - y : String(x||"").replace(/^[„"“']+/,"").localeCompare(String(y||"").replace(/^[„"“']+/,""), undefined, {numeric:true, sensitivity:"base"});
    return c ? c*dir : (a.order??0) - (b.order??0);
  });
}
function sortBtn(key){
  const on = S.f.sort && S.f.sort.key === key, dir = on ? S.f.sort.dir : null;
  return `<button type="button" class="sortbtn ${on?"on":""}" data-sort="${key}" aria-label="Sort by ${SORTS[key][0]}${on?(dir==="asc"?", currently A to Z":", currently Z to A"):""}">${SORTS[key][0]}<span class="arr" aria-hidden="true">${on?(dir==="asc"?"↑":"↓"):"↕"}</span></button>`;
}
function listHTML(rows, opts={}){
  const head = `<div class="list-head" role="row">
    <span></span><span>${sortBtn("name")}</span>
    <span>${opts.hideWork ? '<span class="lh-plain">Category</span>' : `${sortBtn("work")}<span class="lh-sep">/</span>${sortBtn("artist")}`}</span>
    <span>${sortBtn("source")}</span><span class="lh-r">${sortBtn("qty")}</span><span>${sortBtn("status")}</span><span></span>
  </div>`;
  return `<div class="list">${head}${sortRows(rows).map(i=>rowHTML(i,opts)).join("")}</div>`;
}
function sortSelect(){
  const v = S.f.sort ? `${S.f.sort.key}:${S.f.sort.dir}` : "";
  const opts = [["","Sheet order"],["name:asc","Item A–Z"],["work:asc","Artwork A–Z"],["artist:asc","Artist A–Z"],["source:asc","Coming from A–Z"],["status:asc","Status: needs source first"],["status:desc","Status: installed first"],["qty:desc","Qty, most first"]];
  return `<select class="sel sort-sel ${v?"on":""}" id="sortf" aria-label="Sort items">${opts.map(([k,l])=>`<option value="${k}" ${v===k?"selected":""}>${l}</option>`).join("")}</select>`;
}

const CHEVRON = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>';
function rowHTML(it, opts={}){
  const w = workOf(it);
  const open = S.open.has(it.id);
  const nNotes = (it.notes||[]).length, nOpen = (it.notes||[]).filter(n=>!n.done).length;
  const q = Number(it.qty)||1;
  const statusSel = `<select class="status" data-status-for="${it.id}" aria-label="Status for ${esc(it.name)}" ${S.ro?"disabled":""}>${STATUSES.map(([k,l])=>`<option value="${k}" ${it.status===k?"selected":""}>${l}</option>`).join("")}</select>`;
  const workCell = opts.hideWork
    ? `<div class="work"><small>${esc(CAT[it.cat]||"")}</small></div>`
    : `<div class="work"><a href="#/w/${esc(it.work)}" data-stop>${esc(w.title)}</a><small>${esc(w.artist)}</small></div>`;
  const showKind = it.kind && (it.cat==="display"||it.cat==="computer") && !it.name.toLowerCase().includes(it.kind.toLowerCase());
  const src = `<span class="srctxt ${esc(it.source)}">${esc(SRC[it.source]||it.source)}</span>`;
  return `<div class="row ${it.cut?"cut":""} ${open?"open":""}" data-status="${esc(it.status)}" data-id="${it.id}">
    <div class="row-main" data-toggle="${it.id}">
      <button type="button" class="check" data-check="${it.id}" aria-label="${it.status==="installed"?"Mark not installed":"Mark installed"}: ${esc(it.name)}" aria-pressed="${it.status==="installed"}">${CHECK}</button>
      <div class="nm">${esc(it.name)}${showKind?`<span class="kind">${esc(it.kind)}</span>`:""}</div>
      ${workCell}
      <div class="src">${src}</div>
      <div class="qty num">${q>1?`×${q}`:""}</div>
      <div class="status-cell">${statusSel}</div>
      <button type="button" class="expand" aria-expanded="${open}" aria-label="${open?"Close":"Open"} notes and details for ${esc(it.name)}">${nNotes?`<span class="ncount ${nOpen?"has":""}">${nOpen||"✓"}</span>`:""}${CHEVRON}</button>
      <div class="meta-line">${src}${q>1?`<span class="num">×${q}</span>`:""}${nOpen?`<span>${nOpen} note${nOpen===1?"":"s"}</span>`:""}</div>
    </div>
    ${open ? detailHTML(it) : ""}
  </div>`;
}

function notesHTML(col, id, notes){
  return (notes||[]).map((n,i)=>`<div class="note ${n.done?"done":""}">
      <button type="button" class="tick" data-note="${col}|${id}|${i}" aria-label="${n.done?"Reopen note":"Check off note"}" aria-pressed="${!!n.done}">${CHECK}</button>
      <p>${esc(n.text)}</p>
      <small>${n.from==="sheet"?"From the production sheet":`${esc(n.by||"Someone")} · ${esc(fmtT(n.t))}`}${n.done&&n.doneBy?` · checked off by ${esc(n.doneBy)}`:""}</small>
    </div>`).join("") || `<div style="color:var(--faint);font-size:13px">No notes yet.</div>`;
}
function noteForm(col, id){
  const did = `nt-${col}-${id}`;
  return `<form class="addnote" data-addnote="${col}|${id}">
    <textarea id="${did}" data-draft rows="1" placeholder="Add a note: who's bringing it, specs, what's missing…" aria-label="New note" ${S.ro?"disabled":""}></textarea>
    <button class="btn" type="submit" ${S.ro?"disabled":""}>Add</button></form>`;
}

function detailHTML(it){
  const hist = (it.history||[]).slice().reverse();
  const inp = (f, extra="") => `id="ed-${f}-${it.id}" data-edit="${it.id}|${f}" ${S.ro?"disabled":""} ${extra}`;
  return `<div class="detail">
    <div>
      <h4>Notes</h4>
      ${notesHTML("items", it.id, it.notes)}
      ${noteForm("items", it.id)}
    </div>
    <div>
      <h4>Details</h4>
      <div class="form">
        <label for="ed-name-${it.id}">Item</label><input ${inp("name")} data-draft value="${esc(it.name)}">
        <label for="ed-kind-${it.id}">Type</label><input ${inp("kind")} data-draft value="${esc(it.kind||"")}" placeholder="TV, CRT, NUC…">
        <label for="ed-qty-${it.id}">Qty</label><input ${inp("qty",'type="number" min="1"')} data-draft value="${esc(it.qty??1)}">
        <label for="ed-cat-${it.id}">Category</label><select ${inp("cat")}>${CATS.map(([k,l])=>`<option value="${k}" ${it.cat===k?"selected":""}>${l}</option>`).join("")}</select>
        <label for="ed-source-${it.id}">Coming from</label><select ${inp("source")}>${SOURCES.map(([k,l])=>`<option value="${k}" ${it.source===k?"selected":""}>${l}</option>`).join("")}</select>
        <label for="ed-work-${it.id}">Artwork</label><select ${inp("work")}>${worksArr().map(w=>`<option value="${w.id}" ${it.work===w.id?"selected":""}>${esc(w.title)} — ${esc(w.artist)}</option>`).join("")}</select>
      </div>
      ${it.vendor?`<p style="font-size:12px;color:var(--muted);margin:10px 0 0">Sheet said: “${esc(it.vendor)}”${it.cost?` · est. ${money(it.cost)} each`:""}</p>`:it.cost?`<p style="font-size:12px;color:var(--muted);margin:10px 0 0">Est. ${money(it.cost)} each</p>`:""}
      <div style="margin-top:12px"><button type="button" class="btn" data-cut="${it.id}" ${S.ro?"disabled":""}>${it.cut?"Put back on the list":"Mark not needed"}</button></div>
      ${hist.length?`<h4>Change log</h4><ul class="hist">${hist.map(x=>`<li><span class="num">${esc(fmtT(x.t))}</span> · ${esc(x.what)} · ${esc(x.by||"Someone")}</li>`).join("")}</ul>`:""}
    </div>
  </div>`;
}

function renderGear(){
  const all = itemsArr(); const shown = all.filter(matches);
  const secs = CATS.map(([k,l])=>{
    const inCat = all.filter(i=>i.cat===k); const rows = shown.filter(i=>i.cat===k);
    if (!rows.length) return "";
    const live = inCat.filter(i=>!i.cut);
    const here = units(live.filter(i=>i.status==="onsite"||i.status==="installed"));
    const extra = k==="cover" ? ` · ${live.reduce((s,i)=>s+(Number(i.ft)||0),0)} ft specced` : "";
    return `<section class="sec"><div class="sec-h"><h2>${l}</h2><span class="meta num">${units(live)} units · ${here} in gallery · ${live.filter(i=>i.status==="open").length} need a source${extra}</span><div class="mini">${miniBar(inCat)}</div></div>
      ${listHTML(rows)}</section>`;
  }).join("");
  const wsel = S.f.work && S.works.get(S.f.work);
  const jump = wsel ? `<div style="margin:6px 0;font-size:13px">Showing <b>${esc(wsel.artist)}</b>'s gear · <a href="#/w/${esc(S.f.work)}" style="color:var(--link)">Open their page →</a> · <button type="button" class="btn ghost" id="workclear">Show all artists</button></div>` : "";
  return renderSummary() + renderFilters() + jump + (secs || `<div class="empty">Nothing matches these filters.</div>`);
}

function renderArtists(){
  const all = itemsArr();
  const q = S.f.q.toLowerCase();
  const gearOn = S.f.cat.size || S.f.kind.size;
  const gearHit = i => (!S.f.cat.size || S.f.cat.has(i.cat)) && (!S.f.kind.size || S.f.kind.has(i.kind||"Other")) && !i.cut;
  const cards = worksArr().filter(w=>(!S.f.work || w.id===S.f.work) && (!S.f.zone.size || S.f.zone.has(w.zone||"")) && (!q || (w.title+" "+w.artist).toLowerCase().includes(q)) && (!gearOn || all.some(i=>i.work===w.id && gearHit(i)))).map(w=>{
    const its = all.filter(i=>i.work===w.id); const live = its.filter(i=>!i.cut); const c = statusCounts(its);
    const gear = live.filter(i=> gearOn ? gearHit(i) : (i.cat==="display"||i.cat==="computer")).map(i=>`<span>${(Number(i.qty)||1)>1?i.qty+"× ":""}${esc(i.kind||i.name)}</span>`).join("");
    const openNotes = [...its, w].reduce((s,d)=>s+(d.notes||[]).filter(n=>!n.done).length,0);
    const state = c.open ? `<b class="warn">${c.open} need a source</b>` : c.installed===live.length && live.length ? `<b class="ok">All installed</b>` : `<span>${c.onsite+c.installed}/${live.length} in gallery</span>`;
    return `<a class="card" href="#/w/${esc(w.id)}">
      ${w.zone?`<span class="zonetag">${esc(w.zone)}</span>`:""}<div class="t">${esc(w.title)}</div><div class="a">${esc(w.artist)}</div>
      <div class="gear">${gear || '<span style="border:0;background:none;color:var(--faint)">No screen or computer</span>'}</div>
      ${miniBar(its)}
      <div class="foot">${state}<span class="num">${live.length} items${openNotes?` · ✎ ${openNotes}`:""}</span></div>
    </a>`;
  }).join("");
  return `<div class="filters"><input class="search" id="q" type="search" placeholder="Find an artwork or artist" value="${esc(S.f.q)}" aria-label="Search">${artistSelect()}</div>${zoneFilters()}${gearFilters()}
    <div class="grid">${cards || '<div class="empty">No artworks match.</div>'}</div>`;
}

function renderWork(id){
  const w = S.works.get(id);
  if (!w) return `<div class="crumb"><a href="#/artists">← All artworks</a></div><div class="empty">That artwork isn't in the list.</div>`;
  const its = itemsArr().filter(i=>i.work===id); const live = its.filter(i=>!i.cut); const c = statusCounts(its);
  const secs = CATS.map(([k,l])=>{ const rows = its.filter(i=>i.cat===k); if(!rows.length) return "";
    return `<section class="sec"><div class="sec-h"><h2>${l}</h2><span class="meta num">${units(rows.filter(i=>!i.cut))} units</span></div>${listHTML(rows,{hideWork:true})}</section>`; }).join("");
  return `<div class="crumb"><a href="#/artists">← All artworks</a></div>
    <div class="hero">
      <div><h1>${esc(w.title)}</h1><div class="by">${esc(w.artist)}${w.url?` · <a href="${esc(w.url)}" target="_blank" rel="noopener" style="color:var(--link)">${esc(w.url.replace(/^https?:\/\//,"").replace(/\/$/,""))}</a>`:""}</div></div>
      <div class="facts">
        <div><b>${c.installed}/${live.length}</b>installed</div>
        <div><b>${c.open}</b>need a source</div>
        ${w.budget!=null?`<div><b>${money(w.budget)}</b>budget</div>`:""}
      </div>
    </div>
    <div class="areafield"><label for="zone-edit">Area</label><input id="zone-edit" data-draft data-zone-for="${esc(id)}" list="zone-list" value="${esc(w.zone||"")}" placeholder="e.g. LAN Party" ${S.ro?"disabled":""}><datalist id="zone-list">${[...new Set(worksArr().map(x=>x.zone).filter(Boolean))].sort().map(z=>`<option value="${esc(z)}">`).join("")}</datalist></div>
    <div style="margin-top:16px">${miniBar(its)}</div>
    <div style="margin-top:14px"><button class="btn" type="button" id="add-here" data-work="${esc(id)}">+ Add item to this artwork</button></div>
    ${secs || '<div class="empty">No items yet.</div>'}
    <section class="sec worknotes"><div class="sec-h"><h2>Install notes</h2><span class="meta">Placement, wall, power, artist requests</span></div>
      <div class="panel" style="border-top:0;border-radius:0 0 10px 10px">${notesHTML("works", id, w.notes)}${noteForm("works", id)}</div></section>`;
}

function fillNames(){}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("a[data-stop]")) return;
  const chk = t.closest("[data-check]");
  if (chk){ e.stopPropagation(); if(S.ro) return; const it=S.items.get(chk.dataset.check);
    setStatus(chk.dataset.check, it.status==="installed" ? "onsite" : "installed"); return; }
  if (t.closest(".status, .status-cell")){ e.stopPropagation(); return; }
  const stf = t.closest("[data-stf]");
  if (stf){ const k=stf.dataset.stf; S.f.st.has(k)?S.f.st.delete(k):S.f.st.add(k); saveF(); render(); return; }
  const cf = t.closest("[data-catf]");
  if (cf){ const k=cf.dataset.catf; S.f.cat.has(k)?S.f.cat.delete(k):S.f.cat.add(k); S.f.kind.clear(); saveF(); render(); return; }
  const kf = t.closest("[data-kindf]");
  if (kf){ const k=kf.dataset.kindf; S.f.kind.has(k)?S.f.kind.delete(k):S.f.kind.add(k); saveF(); render(); return; }
  if (t.closest("#workclear")){ S.f.work=""; saveF(); render(); return; }
  const sb = t.closest("[data-sort]");
  if (sb){ const k = sb.dataset.sort, cur = S.f.sort;
    S.f.sort = !cur || cur.key !== k ? {key:k, dir:"asc"} : cur.dir === "asc" ? {key:k, dir:"desc"} : null;
    saveF(); render(); return; }
  const zf = t.closest("[data-zonef]");
  if (zf){ const k=zf.dataset.zonef; S.f.zone.has(k)?S.f.zone.delete(k):S.f.zone.add(k); saveF(); render(); return; }
  if (t.closest("#zoneclear")){ S.f.zone.clear(); saveF(); render(); return; }
  if (t.closest("#stclear")){ S.f.st.clear(); saveF(); render(); return; }
  if (t.closest("#gearclear")){ S.f.cat.clear(); S.f.kind.clear(); saveF(); render(); return; }
  if (t.closest("#cutf")){ S.f.showCut=!S.f.showCut; saveF(); render(); return; }
  const note = t.closest("[data-note]");
  if (note){ if(S.ro) return; const [col,id,i]=note.dataset.note.split("|"); toggleNote(col,id,Number(i)); return; }
  const cut = t.closest("[data-cut]");
  if (cut){ const it=S.items.get(cut.dataset.cut); toggleCut(cut.dataset.cut); toast(it.cut?"Back on the list":"Crossed out — still kept in the list"); return; }
  if (t.closest("#add-here")){ openAdd(t.closest("#add-here").dataset.work); return; }
  const tog = t.closest("[data-toggle]");
  if (tog){ const id=tog.dataset.toggle; S.open.has(id)?S.open.delete(id):S.open.add(id); render(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("[data-status-for]")){ setStatus(t.dataset.statusFor, t.value); return; }
  if (t.matches("[data-zone-for]")){ setZone(t.dataset.zoneFor, t.value.trim()); delete S.drafts[t.id]; return; }
  if (t.id==="sortf"){ const [k,d] = t.value.split(":"); S.f.sort = k ? {key:k, dir:d} : null; saveF(); render(); return; }
  if (t.id==="workf"){ S.f.work=t.value; saveF(); render(); return; }
  if (t.id==="srcf"){ S.f.src=t.value; saveF(); render(); return; }
  if (t.matches("[data-edit]")){
    const [id,f] = t.dataset.edit.split("|");
    const labels = {name:"Item",kind:"Type",qty:"Qty",cat:"Category",source:"Source",work:"Artwork"};
    let v = t.value.trim();
    if (f==="qty"){ v = Math.max(1, parseInt(v,10)||1); }
    if (f==="name" && !v){ delete S.drafts[t.id]; render(); return; }
    if (f==="work"){ const w=S.works.get(v); editField(id,"work",v,"Artwork"); toast(`Moved to ${w?w.title:"another artwork"}`); }
    else editField(id, f, v, labels[f]);
    delete S.drafts[t.id];
  }
});
let qT;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches("[data-draft]")) S.drafts[t.id] = t.value;
  if (t.id==="q"){ S.f.q=t.value; clearTimeout(qT); qT=setTimeout(()=>{ saveF(); render(); },150); }
});
document.addEventListener("keydown", e => {
  if (e.target.matches(".addnote textarea") && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); e.target.form.requestSubmit(); }
});
document.addEventListener("submit", e => {
  const form = e.target.closest("[data-addnote]"); if (!form) return;
  e.preventDefault(); if (S.ro) return;
  const [col,id] = form.dataset.addnote.split("|");
  const ta = form.querySelector("textarea"); const text = ta.value.trim(); if(!text) return;
  addNote(col, id, text); ta.value=""; delete S.drafts[ta.id]; toast("Note added");
});
window.addEventListener("hashchange", () => { window.scrollTo(0,0); render(); });

/* add dialog */
const dlg = $("#add-dlg");
$("#add-cat").innerHTML = CATS.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
$("#add-src").innerHTML = SOURCES.map(([k,l])=>`<option value="${k}" ${k==="tbd"?"selected":""}>${l}</option>`).join("");
function openAdd(workId){
  if (!S.db) return;
  $("#add-work").innerHTML = worksArr().map(w=>`<option value="${w.id}">${esc(w.title)} — ${esc(w.artist)}</option>`).join("");
  const m = (location.hash||"").match(/^#\/w\/([\w-]+)/);
  $("#add-work").value = workId || (m && m[1]) || "w99";
  $("#add-form").reset(); $("#add-work").value = workId || (m && m[1]) || "w99"; $("#add-src").value="tbd";
  dlg.showModal(); $("#add-name").focus();
}
$("#add-btn").addEventListener("click", ()=>openAdd());
dlg.addEventListener("close", async () => {
  if (dlg.returnValue !== "ok") return;
  const name = $("#add-name").value.trim(); if (!name) return;
  const kind = $("#add-kind").value.trim(); const note = $("#add-note").value.trim();
  const doc = { work:$("#add-work").value, name, cat:$("#add-cat").value, qty:Math.max(1,parseInt($("#add-qty").value,10)||1),
    source:$("#add-src").value, vendor:"", status: $("#add-src").value==="tbd"||$("#add-src").value==="buy" ? "open" : "assigned",
    cut:false, notes: note?[{t:new Date().toISOString(), by:who(), text:note, done:false}]:[],
    history:[logEntry("Added to the list")] };
  if (kind) doc.kind = kind;
  try { await rpc("wwwinv_add_item", { p_doc: doc }); toast(`Added ${name}`); } catch(err){}
});

/* ---------- boot ---------- */
const toMap = rows => new Map((rows||[]).map(r=>[r.id, r.doc]));
let refreshing = null, again = false;
async function refresh(){
  if (refreshing){ again = true; return refreshing; }
  refreshing = (async () => {
    do {
      again = false;
      const [i, w] = await Promise.all([ S.db.from("wwwinv_items").select("id,doc"), S.db.from("wwwinv_works").select("id,doc") ]);
      if (i.error || w.error) throw (i.error || w.error);
      S.items = toMap(i.data); S.works = toMap(w.data); S.loadedI = S.loadedW = true;
      render();
    } while (again);
  })().finally(()=>{ refreshing = null; });
  return refreshing;
}
async function boot(){
  const nameEl = $("#me");
  S.me = ls.get("www-inv-name", "");
  nameEl.value = S.me;
  nameEl.addEventListener("change", () => { S.me = nameEl.value.trim(); ls.set("www-inv-name", S.me); toast(S.me ? `Changes will be credited to ${S.me}` : "Changes will show as Someone"); });
  try {
    const cfg = await fetch("/api/config").then(r=>r.json());
    if (!cfg.url || !cfg.key) throw new Error("missing config");
    S.db = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession:false } });
    await refresh();
  } catch(e){
    $("#app").innerHTML = `<div class="notice">The inventory couldn't load. Check that the database is set up, then reload.</div>`;
    $("#add-btn").hidden = true; return;
  }
  let t;
  const soon = () => { clearTimeout(t); t = setTimeout(()=>refresh().catch(()=>{}), 250); };
  S.db.channel("wwwinv").on("postgres_changes", { event:"*", schema:"public", table:"wwwinv_items" }, soon)
    .on("postgres_changes", { event:"*", schema:"public", table:"wwwinv_works" }, soon).subscribe();
  setInterval(() => { if (!document.hidden && !document.activeElement?.matches("input,textarea,select")) refresh().catch(()=>{}); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) soon(); });
}
boot();
})();
</script>
